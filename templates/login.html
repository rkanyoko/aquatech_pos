<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aqua Tech POS</title>
    <script>
        (function () {
            var t = localStorage.getItem('aquatech_theme');
            if (t !== 'light' && t !== 'dark') {
                t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-theme-row">
            <button type="button" class="btn-secondary theme-toggle" style="padding:0.35rem 0.75rem;font-size:0.85rem;">
                <span class="theme-icon-light">🌙 Dark</span>
                <span class="theme-icon-dark">☀️ Light</span>
            </button>
        </div>
        <div class="login-brand">Aqua Tech Limited</div>
        <h1>POS Login</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash flash-error">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <input type="submit" value="Sign in" style="margin-top:0.5rem;">
        </form>
    </div>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
