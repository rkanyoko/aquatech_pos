{% extends "base.html" %}

{% block title %}Edit Product{% endblock %}

{% block content %}
    <a href="{{ url_for('products') }}" class="btn-secondary" style="margin-bottom:1rem;">← Back to products</a>
    <h1>Edit Product: {{ product.name }}</h1>

    <form class="page-form" method="post" style="max-width:600px;">
        <label for="name">Product Name:</label>
        <input type="text" id="name" name="name" value="{{ product.name }}" required>

        <label for="description">Description:</label>
        <input type="text" id="description" name="description" value="{{ product.description or '' }}">

        <label for="sku">SKU:</label>
        <input type="text" id="sku" name="sku" value="{{ product.sku }}" required>

        <label for="buying_price">Buying Price (Ksh.) — admin only:</label>
        <input type="number" id="buying_price" name="buying_price" step="0.01" min="0"
               value="{{ product.buying_price or 0 }}">

        <label for="price">Selling Price (Ksh.):</label>
        <input type="number" id="price" name="price" step="1" min="0" value="{{ product.price or 0 }}">
        <p class="field-hint">Items need a selling price and stock before they appear on the sales screen.</p>

        <input type="submit" value="Save Changes">
    </form>
{% endblock %}
